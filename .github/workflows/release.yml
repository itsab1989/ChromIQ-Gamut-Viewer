# Build the ChromIQ Gamut Viewer for every platform ChromIQ supports, and
# attach the results to a release. Triggered by pushing a v* tag.
name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# ONE RUN AT A TIME PER TAG, and a superseded one is stopped rather than left
# racing the newer one to the same release. Retagging is a normal thing to do
# when a build fails, and without this the two runs both try to attach assets
# to one release -- whichever finishes second wins, which is not necessarily
# the one built from the newer commit.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# PATIENCE WITH THE NETWORK, EVERYWHERE, rather than on the pip lines somebody
# remembers to edit. These are pip's own environment variables, so they reach
# every install in every job -- including the ones PyInstaller and setup-python
# make on their own, which no amount of editing our own commands would cover.
#
# WHY IT IS WORTH IT. Six platforms fetch several hundred megabytes of wheels
# each, and a single dropped connection anywhere in that fails a job that has
# already been running for twenty minutes. pip's default is 5 retries and a
# 15-second timeout, which is tuned for a desktop with somebody watching it,
# not for a matrix nobody is watching at all.
env:
  PIP_RETRIES: "10"
  PIP_DEFAULT_TIMEOUT: "60"
  # Never sit waiting for a prompt that will never be answered.
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # EVERY RELEASE SAYS WHAT CHANGED, and this is checked before anything is
  # built. The same check runs again later, where the notes are actually
  # written -- but by then five platforms have spent twenty minutes compiling,
  # and being told about a one-line omission at the end of that is a poor way
  # to find out. Here it costs about fifteen seconds.
  notes:
    name: Release notes
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # A CEILING ON EVERY JOB. GitHub's default is SIX HOURS, and this project
    # has already lost two and a half of them to one wedged tool. Nothing here
    # legitimately takes longer than a few minutes.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: The changelog must have an entry for this tag
        run: |
          python3 python/release_body.py "${GITHUB_REF_NAME}" --out preview.md
          echo "--- what the release page will say ---"
          head -40 preview.md

  build:
    name: ${{ matrix.label }}
    needs: [notes]
    # A tag must pass the check above; a manual run has no tag to check, so
    # `notes` is skipped and the build goes ahead. Without this, `needs` would
    # treat the skip as a reason to skip the build too.
    if: always() && (needs.notes.result == 'success' || needs.notes.result == 'skipped')
    runs-on: ${{ matrix.runner }}
    # The slowest of these builds runs about eight minutes; twice that is
    # room to be slow and still far short of burning an afternoon.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-14
            asset: GamutViewer-macOS-arm64
            expect: arm64
          # macos-15-intel, NOT macos-13. The macos-13 image is the retired
          # Intel one: jobs asking for it are accepted and then sit in the
          # queue for hours without ever being allocated a runner, which
          # blocks the whole matrix and with it the release job, because
          # `needs: build` waits for every leg. A job that never starts is
          # worse than one that fails.
          - label: macOS x86_64
            runner: macos-15-intel
            asset: GamutViewer-macOS-x86_64
            expect: x86_64
          - label: Windows x64
            runner: windows-latest
            asset: GamutViewer-Windows-x64
            expect: x86_64
          # WINDOWS ON ARM, which was the one platform covered on a single
          # architecture -- macOS and Linux each had both, and an ARM Windows
          # machine (a Surface, a Snapdragon X laptop) was running the x64
          # build under emulation. That works and is slowest exactly where
          # this application spends its time, in NumPy and SciPy.
          #
          # CHECKED BEFORE IT WAS ADDED, because the thing this turns on is
          # whether the wheels exist: pip with no wheel falls back to building
          # from source, and Qt does not build inside a CI job. Asked of PyPI
          # rather than assumed -- PyQt6, PyQt6-Qt6, PyQt6-sip, the two
          # WebEngine packages, NumPy, SciPy, Pillow and PyInstaller all
          # publish a win_arm64 wheel, and plotly is pure Python so its one
          # wheel serves every platform.
          - label: Windows arm64
            runner: windows-11-arm
            asset: GamutViewer-Windows-arm64
            expect: arm64
          - label: Linux x86_64
            runner: ubuntu-22.04
            asset: GamutViewer-Linux-x86_64
            expect: x86_64
          # 24.04, NOT 22.04: PyQt6 and PyQt6-WebEngine publish their arm64
          # wheels as manylinux_2_39, which needs glibc 2.39. Ubuntu 22.04 has
          # 2.35, so pip finds nothing installable, falls back to building Qt
          # from source, and the job dies in "Install dependencies". The x86_64
          # wheels are manylinux_2_34 and are happy on 22.04.
          - label: Linux aarch64
            runner: ubuntu-24.04-arm
            asset: GamutViewer-Linux-aarch64
            expect: arm64
    steps:
      # v5 THROUGHOUT. v4 targets Node 20, which GitHub has deprecated and is
      # already force-running on Node 24 -- a warning on every job of every
      # build, and eventually a failure nobody chose the timing of.
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # QtWebEngine needs these to even load on a bare Linux runner.
      - name: Linux system libraries
        if: runner.os == 'Linux'
        # A STEP THAT CANNOT SIT THERE FOR HOURS, and two ways it silently can.
        #
        # v2.39.5 hung here twice: the job reported "in progress" on this step
        # for over three hours with nothing after it, while the other six
        # platforms had finished in minutes. The job's own timeout-minutes: 45
        # did not fire, because a runner that has stopped reporting is not the
        # same as a step that is running long.
        #
        # NEEDRESTART_MODE=a and DEBIAN_FRONTEND=noninteractive are the two
        # standard causes of an apt install stopping to ask a question in CI —
        # a service-restart prompt and a changed configuration file — and
        # neither is wanted here. -y answers apt; it does not answer those.
        #
        # The step timeout is the belt: forty packages installed one at a time
        # take about five minutes when the mirrors are well, so twenty is
        # generous, and a hang now costs twenty minutes instead of a night.
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update
          # 24.04 renamed libasound2 to libasound2t64, and apt fails the whole
          # run over one unknown name -- so each package is asked for on its
          # own and the alternative spelling is tried when one is missing.
          # The x86_64 image happens to ship most of QtWebEngine's runtime
          # dependencies already; the arm64 one is leaner and does not, so
          # importing the app died there while passing on x86_64. Everything
          # QtWebEngine actually dlopen()s is therefore asked for explicitly
          # rather than relied on being present.
          for pkg in libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
                     libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
                     libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
                     libxcb-xkb1 libxcb-image0 libxcb-sync1 libxcb-xfixes0 \
                     libnss3 libnspr4 libdbus-1-3 libxcomposite1 libxdamage1 \
                     libxrandr2 libxtst6 libxi6 libxshmfence1 libdrm2 \
                     libgbm1 libcups2 libatk1.0-0 libatk-bridge2.0-0 \
                     libpango-1.0-0 libpangocairo-1.0-0 libcairo2 \
                     libfontconfig1 libfreetype6 \
                     libopus0 libminizip1 libwebp7 libsnappy1v5 \
                     libevent-2.1-7 libxslt1.1 liblcms2-2 \
                     libharfbuzz0b libgraphite2-3; do
            sudo apt-get install -y "$pkg" || echo "skipped $pkg"
          done
          # Renamed under the 64-bit time_t transition; ask for both spellings.
          for pair in "libasound2t64 libasound2" "libcups2t64 libcups2" \
                      "libatk1.0-0t64 libatk1.0-0" \
                      "libatk-bridge2.0-0t64 libatk-bridge2.0-0"; do
            set -- $pair
            sudo apt-get install -y "$1" || sudo apt-get install -y "$2" \
              || echo "no package for $1 under either name"
          done

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt pyinstaller

      # QtWebEngine links a long tail of media and compression libraries, and
      # which of them the runner image happens to ship differs by image and
      # changes over time -- libopus and libminizip were both missing from the
      # arm64 image while present on x86_64. Guessing the list and pushing a
      # new tag for each miss costs a build cycle every time, so the job asks
      # the library itself what it is missing and installs whatever provides
      # it. This runs after pip, because the .so being interrogated arrives
      # with PyQt6.
      - name: Resolve any remaining QtWebEngine libraries
        if: runner.os == 'Linux'
        run: |
          CORE=$(python -c "
          import pathlib, PyQt6
          hits = sorted(pathlib.Path(PyQt6.__file__).parent.rglob('libQt6WebEngineCore.so*'))
          print(hits[0] if hits else '')
          ")
          if [ -z "$CORE" ]; then
            echo "QtWebEngine core library not found; nothing to resolve"
            exit 0
          fi
          MISSING=$(ldd "$CORE" | awk '/not found/ {print $1}' | sort -u)
          if [ -z "$MISSING" ]; then
            echo "every QtWebEngine dependency is already satisfied"
            exit 0
          fi
          echo "missing: $MISSING"
          sudo apt-get install -y apt-file
          sudo apt-file update
          for so in $MISSING; do
            pkg=$(apt-file search -l -x "/${so}$" | head -1)
            if [ -n "$pkg" ]; then
              echo "$so is in $pkg"
              sudo apt-get install -y "$pkg" || echo "could not install $pkg"
            else
              echo "nothing provides $so"
            fi
          done
          echo "--- still missing after resolving ---"
          ldd "$CORE" | awk '/not found/ {print $1}' | sort -u

      - name: Check it reports its version
        run: python python/gamut_app.py --version

      - name: Check the whole graphical stack loads
        # Separate from the version check on purpose: this is the one that can
        # legitimately fail on a platform where QtWebEngine will not load, and
        # it should say so loudly rather than hide inside another step. The
        # probe is a real file, not an inline snippet: a shell heredoc is
        # bash-only and the Windows runner uses PowerShell, so an inline
        # version failed there while working on Linux and macOS.
        working-directory: python
        env:
          QT_QPA_PLATFORM: offscreen
        run: python ../.github/check_graphics.py

      - name: Run the tests
        working-directory: python
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          # WINDOWS WRITES ITS CONSOLE IN cp1252 UNLESS TOLD OTHERWISE, and
          # this suite talks about ΔE and uses em-dashes in the sentences it
          # asserts on. The mangling was visible in the log for two builds --
          # "�Open the download page� runs 134 points past" -- and printing a
          # character cp1252 has no room for ends the run with a non-zero exit
          # while every check has passed. 650 passed, 8 skipped, exit 1.
          #
          # This is what the pytest-9 probe was chasing. It is not pytest and
          # it is not our code: it is the encoding of the pipe the summary is
          # written to.
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
          # AND SAY OUT LOUD THAT THIS MACHINE HAS NO ARGYLLCMS, rather than
          # relying on it happening to be absent.
          #
          # It IS absent here, and that is the point: most of this application
          # works without ArgyllCMS and takes different paths when it is
          # missing, so these machines exercise a set of branches the
          # developer's machine never reaches. That asymmetry has already
          # broken a release -- a fallback for "ArgyllCMS is not installed"
          # was written with only its happy path, passed locally, and failed
          # on all five builders at once.
          #
          # Setting it explicitly means the same run can be had anywhere:
          #     GAMUTVIEW_NO_ARGYLL=1 pytest -q
          # If a builder ever DOES get ArgyllCMS installed, this keeps the
          # checks measuring what they were written to measure.
          GAMUTVIEW_NO_ARGYLL: "1"
        run: |
          # pyyaml is for the tests alone -- two of them read the workflow
          # itself to check the changelog guard is still wired in. The
          # application needs neither, so neither is in requirements.txt.
          pip install pytest pyyaml
          # -rf NAMES THE FAILURES. Plain -q prints dots and a count, and when
          # a run stops early the log ends mid-progress with nothing saying
          # which checks broke -- which cost two round trips to a build
          # machine that is not this one. The summary is cheap and it is the
          # only thing anybody reads when a build goes red.
          # ONE RUN, AND ITS EXIT CODE IS THE ANSWER.
          #
          # This ran the suite TWICE on every platform and passed if either
          # attempt exited 0. That was a workaround for a real thing: Windows
          # used to report "650 passed, 8 skipped" and then exit 1, because
          # something in our code raised during finalisation -- after the
          # summary printed, where the unraisable and thread-exception hooks
          # collect. Turning those hooks off made it exit 0, which is what
          # identified it.
          #
          # IT HAS NOT HAPPENED SINCE. Four consecutive releases -- v2.18.0,
          # v2.19.0, v2.20.0 and v2.20.2 -- all reported plain=0 on Windows,
          # through the very warning this step used to print. Whatever it was
          # went away with the tidying that closed windows and removed the
          # temporary folders properly.
          #
          # SO THE WORKAROUND GOES. It was never harmless: a genuinely failing
          # check fails both runs and still fails the build, but a SECOND
          # unraisable appearing later would have been swallowed silently, and
          # every build paid for the suite twice. If the finalisation fault
          # comes back, this now says so by going red -- which is the point.
          python -m pytest . -q -rf --tb=line

      - name: Build
        run: pyinstaller --noconfirm GamutViewer.spec

      # AND IS IT REALLY THE ARCHITECTURE WE ARE ABOUT TO CALL IT?
      #
      # Nothing else in this build can tell. On a machine with an emulation
      # layer a toolchain for the other architecture runs quite happily and
      # emits a working binary of the wrong kind: the tests pass, because they
      # run under emulation too; the packaging succeeds; the upload succeeds;
      # and the artefact goes out under a name that is not true. The only
      # symptom is that it is slow on precisely the machines it was built for,
      # or will not start on one without emulation.
      #
      # So the file is opened and the machine field the linker wrote is read.
      # Every platform, not only the new one -- the same mistake is possible
      # on any of them, and a check that only guards the case somebody
      # happened to think of is half a check.
      - name: The binary must be the architecture we say it is
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) built="dist/GamutViewer/GamutViewer.exe" ;;
            macOS)   built="dist/ChromIQ Gamut Viewer.app/Contents/MacOS/GamutViewer" ;;
            *)       built="dist/GamutViewer/GamutViewer" ;;
          esac
          python scripts/check_binary_arch.py "$built" "${{ matrix.expect }}"

      # A .app is a directory; zip it so the bundle survives the download with
      # its executable bit intact.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --keepParent "ChromIQ Gamut Viewer.app" \
            "../${{ matrix.asset }}.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/GamutViewer/* -DestinationPath "${{ matrix.asset }}.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf "${{ matrix.asset }}.tar.gz" GamutViewer

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.zip
            ${{ matrix.asset }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # 30, NOT 15, AND THE PATIENT RETRY BELOW IS WHY. This job downloads about
    # 1.6 GB of artefacts before it uploads anything, and the retry that rides
    # out a GitHub outage can wait ten minutes on its own. At 15 the retry
    # would have been killed part way through -- a timeout cancelling the very
    # thing added to survive an outage, which is worse than not adding it,
    # because the run would then fail for a reason that has nothing to do with
    # what went wrong.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      # WHAT CHANGED IN THIS VERSION, from CHANGELOG.md. Without this every
      # release carried the same words -- a description of the application --
      # so the one thing that differed between two releases was the one thing
      # the page did not say. This also fails the release outright when the
      # changelog has nothing for the tag, or when the tag disagrees with the
      # version inside the application: a release whose notes are quietly
      # wrong is worse than a build that stopped and said so.
      # DEMO PROFILES WITH EVERY RELEASE, so somebody who has just downloaded
      # the application can try the timeline on real files without owning a
      # printer, a spectrophotometer and five years of patience.
      #
      # BUILT HERE RATHER THAN COMMITTED: twenty-one profiles of 1257 kB each,
      # differing in about six thousand bytes, is twenty-six megabytes of
      # near-duplicate binary in the repository for something that takes ten
      # seconds to make. The generator checks that each set really does show
      # the shape it claims -- a demo that does not demonstrate the thing
      # teaches the reader that the feature does not work -- so a failure here
      # stops the release rather than shipping a misleading download.
      - name: Build the demo profiles
        run: |
          python3 -m pip install --quiet numpy scipy
          python3 scripts/make_demo_runs.py --out "demo-profiles"
          cd demo-profiles && zip -q -r ../assets/ChromIQ-demo-profiles.zip . \
            && cd .. && ls -la assets/ChromIQ-demo-profiles.zip

      - name: Write the release notes for this version
        # python3, not python: the release runner has no setup-python step
        # and Ubuntu does not guarantee a bare "python" on PATH. The script
        # needs nothing beyond the standard library, so nothing is installed.
        run: python3 python/release_body.py "${GITHUB_REF_NAME}" --out body.md

      # THE LAST STEP IS THE ONE MOST LIKELY TO FAIL, AND IT FAILS LATE.
      # Six builds run for half an hour and then this one call decides whether
      # any of it reaches anybody. Twice now GitHub has answered it with 503
      # -- once during a Pages outage that also took this down -- and the
      # action's own retries gave up after about two seconds:
      #
      #   17:48:51 503 / 17:48:53 503 / 17:48:55 503 -> "Too many retries."
      #
      # Three tries inside four seconds is not a retry policy for an outage;
      # it is a retry policy for a dropped packet. An outage lasts minutes, so
      # the waiting has to be measured in minutes too. Everything is already
      # built and uploaded as artefacts by this point, so waiting costs a
      # runner sitting idle and saves re-running the entire matrix by hand.
      - name: Attach everything to the release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: false
          body_path: body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # NOT FATAL ANY MORE. This is the fast path; the step below is the
        # patient one, and it only runs when this has already failed.
        continue-on-error: true
        id: attach

      # A SECOND, PATIENT ATTEMPT, and it only runs when the first failed.
      # gh is used directly here rather than the action, because what is
      # needed is control of the waiting rather than another opinion about
      # retries -- and because if the release already exists from a partial
      # first attempt, uploading with --clobber finishes the job instead of
      # colliding with it.
      - name: Try again, patiently, if GitHub was having a bad day
        if: steps.attach.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          tag="${GITHUB_REF_NAME}"
          for attempt in $(seq 1 10); do
            echo "attempt $attempt for $tag"
            if gh release view "$tag" >/dev/null 2>&1; then
              if gh release upload "$tag" assets/* --clobber; then
                echo "assets attached on attempt $attempt"; exit 0
              fi
            elif gh release create "$tag" assets/* \
                   --title "$tag" --notes-file body.md; then
              echo "release created on attempt $attempt"; exit 0
            fi
            echo "not yet -- waiting 60s"
            sleep 60
          done
          echo "::error::GitHub would not accept the release after 10 tries \
          over ten minutes. The builds all succeeded and are attached to this \
          run as artefacts; re-run this job once githubstatus.com is clear."
          exit 1
