# Build the Measured Gamut Viewer for every platform ChromIQ supports, and
# attach the results to a release. Triggered by pushing a v* tag.
name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-14
            asset: GamutViewer-macOS-arm64
          - label: macOS x86_64
            runner: macos-13
            asset: GamutViewer-macOS-x86_64
          - label: Windows x64
            runner: windows-latest
            asset: GamutViewer-Windows-x64
          - label: Linux x86_64
            runner: ubuntu-22.04
            asset: GamutViewer-Linux-x86_64
          # 24.04, NOT 22.04: PyQt6 and PyQt6-WebEngine publish their arm64
          # wheels as manylinux_2_39, which needs glibc 2.39. Ubuntu 22.04 has
          # 2.35, so pip finds nothing installable, falls back to building Qt
          # from source, and the job dies in "Install dependencies". The x86_64
          # wheels are manylinux_2_34 and are happy on 22.04.
          - label: Linux aarch64
            runner: ubuntu-24.04-arm
            asset: GamutViewer-Linux-aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # QtWebEngine needs these to even load on a bare Linux runner.
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # 24.04 renamed libasound2 to libasound2t64, and apt fails the whole
          # run over one unknown name -- so each package is asked for on its
          # own and the alternative spelling is tried when one is missing.
          for pkg in libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
                     libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libnss3 \
                     libdbus-1-3; do
            sudo apt-get install -y "$pkg" || echo "skipped $pkg"
          done
          sudo apt-get install -y libasound2t64 \
            || sudo apt-get install -y libasound2 \
            || echo "no libasound package under either name"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt pyinstaller

      - name: Check it reports its version
        run: python python/gamut_app.py --version

      - name: Check the whole graphical stack loads
        # Separate from the version check on purpose: this is the one that can
        # legitimately fail on a platform where QtWebEngine will not load, and
        # it should say so loudly rather than hide inside another step.
        working-directory: python
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "
          import gamut_app
          print('the application imports, including QtWebEngine')
          "

      - name: Run the tests
        working-directory: python
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pip install pytest
          python -m pytest . -q

      - name: Build
        run: pyinstaller --noconfirm GamutViewer.spec

      # A .app is a directory; zip it so the bundle survives the download with
      # its executable bit intact.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --keepParent "Measured Gamut Viewer.app" \
            "../${{ matrix.asset }}.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/GamutViewer/* -DestinationPath "${{ matrix.asset }}.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf "${{ matrix.asset }}.tar.gz" GamutViewer

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.zip
            ${{ matrix.asset }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Attach everything to the release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: false
          body_path: .github/release-notes.md
