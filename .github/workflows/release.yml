# Build the ChromIQ Gamut Viewer for every platform ChromIQ supports, and
# attach the results to a release. Triggered by pushing a v* tag.
name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # EVERY RELEASE SAYS WHAT CHANGED, and this is checked before anything is
  # built. The same check runs again later, where the notes are actually
  # written -- but by then five platforms have spent twenty minutes compiling,
  # and being told about a one-line omission at the end of that is a poor way
  # to find out. Here it costs about fifteen seconds.
  notes:
    name: Release notes
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The changelog must have an entry for this tag
        run: |
          python3 python/release_body.py "${GITHUB_REF_NAME}" --out preview.md
          echo "--- what the release page will say ---"
          head -40 preview.md

  build:
    name: ${{ matrix.label }}
    needs: [notes]
    # A tag must pass the check above; a manual run has no tag to check, so
    # `notes` is skipped and the build goes ahead. Without this, `needs` would
    # treat the skip as a reason to skip the build too.
    if: always() && (needs.notes.result == 'success' || needs.notes.result == 'skipped')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-14
            asset: GamutViewer-macOS-arm64
          # macos-15-intel, NOT macos-13. The macos-13 image is the retired
          # Intel one: jobs asking for it are accepted and then sit in the
          # queue for hours without ever being allocated a runner, which
          # blocks the whole matrix and with it the release job, because
          # `needs: build` waits for every leg. A job that never starts is
          # worse than one that fails.
          - label: macOS x86_64
            runner: macos-15-intel
            asset: GamutViewer-macOS-x86_64
          - label: Windows x64
            runner: windows-latest
            asset: GamutViewer-Windows-x64
          - label: Linux x86_64
            runner: ubuntu-22.04
            asset: GamutViewer-Linux-x86_64
          # 24.04, NOT 22.04: PyQt6 and PyQt6-WebEngine publish their arm64
          # wheels as manylinux_2_39, which needs glibc 2.39. Ubuntu 22.04 has
          # 2.35, so pip finds nothing installable, falls back to building Qt
          # from source, and the job dies in "Install dependencies". The x86_64
          # wheels are manylinux_2_34 and are happy on 22.04.
          - label: Linux aarch64
            runner: ubuntu-24.04-arm
            asset: GamutViewer-Linux-aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # QtWebEngine needs these to even load on a bare Linux runner.
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # 24.04 renamed libasound2 to libasound2t64, and apt fails the whole
          # run over one unknown name -- so each package is asked for on its
          # own and the alternative spelling is tried when one is missing.
          # The x86_64 image happens to ship most of QtWebEngine's runtime
          # dependencies already; the arm64 one is leaner and does not, so
          # importing the app died there while passing on x86_64. Everything
          # QtWebEngine actually dlopen()s is therefore asked for explicitly
          # rather than relied on being present.
          for pkg in libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
                     libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
                     libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
                     libxcb-xkb1 libxcb-image0 libxcb-sync1 libxcb-xfixes0 \
                     libnss3 libnspr4 libdbus-1-3 libxcomposite1 libxdamage1 \
                     libxrandr2 libxtst6 libxi6 libxshmfence1 libdrm2 \
                     libgbm1 libcups2 libatk1.0-0 libatk-bridge2.0-0 \
                     libpango-1.0-0 libpangocairo-1.0-0 libcairo2 \
                     libfontconfig1 libfreetype6 \
                     libopus0 libminizip1 libwebp7 libsnappy1v5 \
                     libevent-2.1-7 libxslt1.1 liblcms2-2 \
                     libharfbuzz0b libgraphite2-3; do
            sudo apt-get install -y "$pkg" || echo "skipped $pkg"
          done
          # Renamed under the 64-bit time_t transition; ask for both spellings.
          for pair in "libasound2t64 libasound2" "libcups2t64 libcups2" \
                      "libatk1.0-0t64 libatk1.0-0" \
                      "libatk-bridge2.0-0t64 libatk-bridge2.0-0"; do
            set -- $pair
            sudo apt-get install -y "$1" || sudo apt-get install -y "$2" \
              || echo "no package for $1 under either name"
          done

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt pyinstaller

      # QtWebEngine links a long tail of media and compression libraries, and
      # which of them the runner image happens to ship differs by image and
      # changes over time -- libopus and libminizip were both missing from the
      # arm64 image while present on x86_64. Guessing the list and pushing a
      # new tag for each miss costs a build cycle every time, so the job asks
      # the library itself what it is missing and installs whatever provides
      # it. This runs after pip, because the .so being interrogated arrives
      # with PyQt6.
      - name: Resolve any remaining QtWebEngine libraries
        if: runner.os == 'Linux'
        run: |
          CORE=$(python -c "
          import pathlib, PyQt6
          hits = sorted(pathlib.Path(PyQt6.__file__).parent.rglob('libQt6WebEngineCore.so*'))
          print(hits[0] if hits else '')
          ")
          if [ -z "$CORE" ]; then
            echo "QtWebEngine core library not found; nothing to resolve"
            exit 0
          fi
          MISSING=$(ldd "$CORE" | awk '/not found/ {print $1}' | sort -u)
          if [ -z "$MISSING" ]; then
            echo "every QtWebEngine dependency is already satisfied"
            exit 0
          fi
          echo "missing: $MISSING"
          sudo apt-get install -y apt-file
          sudo apt-file update
          for so in $MISSING; do
            pkg=$(apt-file search -l -x "/${so}$" | head -1)
            if [ -n "$pkg" ]; then
              echo "$so is in $pkg"
              sudo apt-get install -y "$pkg" || echo "could not install $pkg"
            else
              echo "nothing provides $so"
            fi
          done
          echo "--- still missing after resolving ---"
          ldd "$CORE" | awk '/not found/ {print $1}' | sort -u

      - name: Check it reports its version
        run: python python/gamut_app.py --version

      - name: Check the whole graphical stack loads
        # Separate from the version check on purpose: this is the one that can
        # legitimately fail on a platform where QtWebEngine will not load, and
        # it should say so loudly rather than hide inside another step. The
        # probe is a real file, not an inline snippet: a shell heredoc is
        # bash-only and the Windows runner uses PowerShell, so an inline
        # version failed there while working on Linux and macOS.
        working-directory: python
        env:
          QT_QPA_PLATFORM: offscreen
        run: python ../.github/check_graphics.py

      - name: Run the tests
        working-directory: python
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # pyyaml is for the tests alone -- two of them read the workflow
          # itself to check the changelog guard is still wired in. The
          # application needs neither, so neither is in requirements.txt.
          pip install pytest pyyaml
          # -rf NAMES THE FAILURES. Plain -q prints dots and a count, and when
          # a run stops early the log ends mid-progress with nothing saying
          # which checks broke -- which cost two round trips to a build
          # machine that is not this one. The summary is cheap and it is the
          # only thing anybody reads when a build goes red.
          # -W error::pytest.PytestUnraisableExceptionWarning would hide the
          # answer; -rA shows the warnings summary, which is where pytest 9
          # reports an exception raised during finalisation -- the one thing
          # that can give a non-zero exit with nothing failing.
          python -m pytest . -q -rA --tb=line

      - name: Build
        run: pyinstaller --noconfirm GamutViewer.spec

      # A .app is a directory; zip it so the bundle survives the download with
      # its executable bit intact.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --keepParent "ChromIQ Gamut Viewer.app" \
            "../${{ matrix.asset }}.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/GamutViewer/* -DestinationPath "${{ matrix.asset }}.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf "${{ matrix.asset }}.tar.gz" GamutViewer

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.zip
            ${{ matrix.asset }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      # WHAT CHANGED IN THIS VERSION, from CHANGELOG.md. Without this every
      # release carried the same words -- a description of the application --
      # so the one thing that differed between two releases was the one thing
      # the page did not say. This also fails the release outright when the
      # changelog has nothing for the tag, or when the tag disagrees with the
      # version inside the application: a release whose notes are quietly
      # wrong is worse than a build that stopped and said so.
      - name: Write the release notes for this version
        # python3, not python: the release runner has no setup-python step
        # and Ubuntu does not guarantee a bare "python" on PATH. The script
        # needs nothing beyond the standard library, so nothing is installed.
        run: python3 python/release_body.py "${GITHUB_REF_NAME}" --out body.md

      - name: Attach everything to the release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: false
          body_path: body.md
